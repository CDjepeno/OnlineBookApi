services:
  ############################# Backend NESTJS
  backend:
    build:
      context: ./apps/nest
      dockerfile: Dockerfile.dev
    container_name: nest_backend
    ports:
      - "8000:8000"
    volumes:
      - ./apps/nest:/app
      - nest_node_modules:/apps/node_modules 
      - ./apps/nest/src/infras/clients/kafka/certs:/app/src/infras/clients/kafka/certs
    env_file:
      - .env
    environment:
      DATABASE_HOST: ${DB_HOST}
      DATABASE_PORT: ${DB_PORT}
      DATABASE_USER: ${DB_USERNAME}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      DATABASE_NAME: ${DB_NAME}
      NODE_ENV: development
      KAFKA_BROKER: ${KAFKA_BROKER}
      KAFKA_CA_CERT_PATH: ${KAFKA_CA_CERT_PATH}
      KAFKA_CLIENT_CERT_PATH: ${KAFKA_CLIENT_CERT_PATH}
      KAFKA_CLIENT_KEY_PATH: ${KAFKA_CLIENT_KEY_PATH}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}
    depends_on:
      db:
        condition: service_started
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - onelineBook_network
  ############################# Frontend NEXT.JS
  nextjs:
    build:
      context: ./apps/client-next
      dockerfile: Dockerfile
    container_name: next_frontend
    ports:
      - "3001:3000"  # 🔥 On mappe le port 3000 du conteneur vers 3001 sur l'hôte
    volumes:
      - ./apps/client-next:/app
      - next_node_modules:/apps/client-next/node_modules
    environment:
      NODE_ENV: development
    command: npm run dev
    networks:
      - onelineBook_network

  ############################# Database MYSQL
  db:
    image: mysql:8.0 
    container_name: mysql_db
    restart: always
    ports:
      - "3307:3306"           
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - onelineBook_network
  ############################# Zookeeper
  zookeeper:
    container_name: zookeeper
    image: docker.io/bitnami/zookeeper:3.9
    ports:
      - "2181:2181"
    volumes:
      - "zookeeper_data:/bitnami"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - onelineBook_network
  ############################# Message Broker KAFKA
  kafka:
    container_name: kafka
    image: docker.io/bitnami/kafka:3.4
    ports:
      - "9094:9094"
    volumes:
      - "kafka_data:/bitnami"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://kafka:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    depends_on:
      - zookeeper
    networks:
      - onelineBook_network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server kafka:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  ############################# Message Broker KAFKA
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9094
    networks:
      - onelineBook_network
  ############################# Redis
  redis:
    image: redis:latest
    container_name: my_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass mystrongpassword
    environment:
      - REDIS_PASSWORD=mystrongpassword
    networks:
      - onelineBook_network
     

volumes:
  db_data:
  react_node_modules:
  nest_node_modules:
  next_node_modules:
  zookeeper_data:
    driver: local
  kafka_data:
    driver: local

networks:
  onelineBook_network:  # 🔥 Définition du réseau
    driver: bridge
