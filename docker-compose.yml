
services:
  app:
    build: 
      context: ./apps/nest
      dockerfile: Dockerfile
    container_name: nest-app
    env_file:
      - ./apps/nest/.env.docker
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    command: npm run start:prod
    volumes:
      # À retirer en prod si tu ne veux pas monter le code en live
      - ./apps/nest:/app

  mysql:
    image: mysql:8
    container_name: mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Bonjour_12@
      MYSQL_DATABASE: book_db
      MYSQL_USER: book_user
      MYSQL_PASSWORD: Bonjour_12@
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
